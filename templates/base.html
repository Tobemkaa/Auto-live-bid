{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Auto Live-Bid Naija{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
    <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
    <link rel="icon" href="{% static 'favicon-512.png' %}" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'favicon-512.png' %}">
</head>
<body>
    {% block content %}{% endblock %}

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        var statNumbers = document.querySelectorAll(".stat-number");
        if (statNumbers.length) {
            var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            var animateCount = function (el) {
                var target = parseFloat(el.dataset.countTo);
                var suffix = el.dataset.suffix || "";
                var prefix = el.dataset.prefix || "";
                if (reduceMotion) { el.textContent = prefix + target.toLocaleString() + suffix; return; }
                var start = null, duration = 1200;
                function step(ts) {
                    if (!start) start = ts;
                    var progress = Math.min((ts - start) / duration, 1);
                    var eased = 1 - Math.pow(1 - progress, 3);
                    el.textContent = prefix + Math.floor(eased * target).toLocaleString() + suffix;
                    if (progress < 1) window.requestAnimationFrame(step);
                    else el.textContent = prefix + target.toLocaleString() + suffix;
                }
                window.requestAnimationFrame(step);
            };
            var statObserver = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) { animateCount(entry.target); statObserver.unobserve(entry.target); }
                });
            }, { threshold: 0.4 });
            statNumbers.forEach(function (el) { statObserver.observe(el); });
        }

        var revealEls = document.querySelectorAll(".reveal");
        if (revealEls.length) {
            if ("IntersectionObserver" in window) {
                var revealObserver = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("is-visible");
                            revealObserver.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.15 });
                revealEls.forEach(function (el) { revealObserver.observe(el); });
            } else {
                revealEls.forEach(function (el) { el.classList.add("is-visible"); });
            }
        }

        document.querySelectorAll(".message").forEach(function (msg) {
            var timer = setTimeout(function () { dismissMessage(msg); }, 4500);
            var closeBtn = msg.querySelector(".message-close");
            if (closeBtn) {
                closeBtn.addEventListener("click", function () {
                    clearTimeout(timer);
                    dismissMessage(msg);
                });
            }
        });

        function dismissMessage(msg) {
            msg.classList.add("is-fading");
            setTimeout(function () { msg.remove(); }, 450);
        }

        

        
    });
    </script>
</body>
</html>
